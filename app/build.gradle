plugins { id 'com.android.application' }

android {
 namespace 'de.nomercy.guten8'
 compileSdk 35
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'de.nomercy.guten8'; minSdk 24; targetSdk 35; versionCode (System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1); versionName (System.getenv('GITHUB_RUN_NUMBER') ? '1.0.' + System.getenv('GITHUB_RUN_NUMBER') : '1.0.0') }
 signingConfigs {
   release {
     if (System.getenv('KEYSTORE_PATH')) {
       storeFile file(System.getenv('KEYSTORE_PATH'))
       storePassword System.getenv('KEYSTORE_PASSWORD')
       keyAlias System.getenv('KEY_ALIAS')
       keyPassword System.getenv('KEY_PASSWORD')
     }
   }
 }
 buildTypes {
   release {
     minifyEnabled false
     if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.release
   }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
