/* GuteN8 illustrated library theme */
body{background:radial-gradient(ellipse at 15% 0%,#496bc6 0%,#223f9c 42%,#15245d 100%);background-attachment:fixed}
header{background:#20377f99;backdrop-filter:blur(8px);border-bottom:1px solid #ffffff24}

.chips button{box-shadow:0 3px 5px #0002}

/* Visual alignment with the illustrated GuteN8 design reference */
:root{--storybook-blue:#0877f4;--storybook-ink:#11275e}
#home,#library,#bookmarks,#favorites{background:radial-gradient(ellipse at 50% 22%,#55a5ee 0%,#2664ba 49%,#10245b 100%);background-attachment:fixed}
#bookmarks,#favorites{position:relative;isolation:isolate}
#bookmarks:before,#favorites:before{content:'🌙　✦　⭐　✦　🌟';position:absolute;top:88px;left:0;right:0;text-align:center;font-size:31px;letter-spacing:3px;opacity:.9;pointer-events:none;z-index:-1}
#bookmarks:after,#favorites:after{content:'🌲　📚　🏮　🌲';position:absolute;bottom:108px;left:0;right:0;text-align:center;font-size:58px;opacity:.85;pointer-events:none;z-index:-1}
#bookmarks header,#favorites header,#library header{background:linear-gradient(105deg,#0c286e,#075cbb);border:0}
#bookmarks>.small{color:#eef6ff!important;font-size:14px!important}
#favoriteCards,#bookmarkCards{padding:0 14px}
#favoriteCards .empty-state,#bookmarkCards .empty-state{margin-top:155px;padding:27px 20px 30px;background:linear-gradient(145deg,#fff9e8,#fff0cf);border:2px solid #fff;border-radius:26px;box-shadow:0 12px 25px #091a4b55;color:var(--storybook-ink);min-height:285px}
#favoriteCards .empty-state span,#bookmarkCards .empty-state span{font-size:49px;color:#113779}
#favoriteCards .empty-state strong,#bookmarkCards .empty-state strong{font-size:20px;margin:12px 0}
#favoriteCards .empty-state p,#bookmarkCards .empty-state p{font-size:15px;color:#243963;line-height:1.5}
#favoriteCards .empty-state button,#bookmarkCards .empty-state button{background:linear-gradient(#148cff,#0052b9);border:2px solid white;border-radius:28px;box-shadow:0 4px 8px #10295855;font-size:16px;padding:12px 18px}
#settings{background:radial-gradient(ellipse at 50% 15%,#183a8d,#0b143e 78%)}
#settings header{background:#142a68}
#settings .sleep-art{height:240px;margin:12px 16px 0;border:1px solid #ffffff26;background:radial-gradient(ellipse at 50% 85%,#334a9a,#101943 75%);border-radius:28px}
#settings .sleep-art .sleep-animals{bottom:0;left:0;right:0;filter:drop-shadow(0 10px 15px #0007)}
#settings .sleep-art .sleep-animals img{width:78%;max-height:210px;object-fit:contain}
#settings .sleep-subtitle{font-size:17px;line-height:1.6;margin:16px 0 20px}
#settings .panel.night{margin:0 14px 22px;padding:17px 18px 22px;border-radius:24px;background:linear-gradient(155deg,#344b90,#1b2555)!important;border:1px solid #8c9ed3}
#settings .panel.night h2{font-size:23px;margin:7px 0 18px}
#settings .setting{min-height:62px;gap:12px;border-bottom:1px solid #ffffff38;font-size:15px}
#settings .setting input[type=range]{accent-color:#168bff;max-width:45%;width:45%}
#settings .setting input[type=checkbox]{appearance:none;flex-shrink:0;width:43px;height:25px;border-radius:30px;background:#a0a6c1;position:relative;box-shadow:inset 0 1px 3px #0005}
#settings .setting input[type=checkbox]:before{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;background:white;border-radius:50%;box-shadow:0 1px 4px #0005;transition:transform .15s}
#settings .setting input[type=checkbox]:checked{background:#1689ff}
#settings .setting input[type=checkbox]:checked:before{transform:translateX(18px)}
#settings .setting button,#settings .setting select{border:1px solid #b3c6f7;border-radius:13px;background:#f0f2ff;color:#172d64;padding:9px 12px}
.nav{border-top:3px solid #a7d2ff;border-radius:22px 22px 0 0;background:#fffaf2;padding:12px 1px max(12px,env(safe-area-inset-bottom))}
.nav button{font-weight:650;min-width:0}.nav button:focus-visible{outline:2px solid #167cff}
@media(max-width:370px){#settings .setting{font-size:13px}#settings .panel.night{padding:14px}#favoriteCards .empty-state,#bookmarkCards .empty-state{margin-top:115px}}

/* Storybook illustration integration — story data and individual covers unchanged */
#home,#favorites,#bookmarks{background-image:url('art/storybook-night.svg');background-position:center top;background-size:100% 100%;background-attachment:scroll}
#home .hero{min-height:0;padding:18px 17px 20px;background:transparent}
#home .hero:before,#home .hero:after{display:none}
.home-sign{position:relative;z-index:1;width:min(95%,340px);margin:0 auto 8px;padding:13px 15px 11px;border:5px solid #8b4c24;border-radius:45% 45% 18px 18px;background:linear-gradient(160deg,#ffdf9a,#cb874b 65%,#ffcc77);box-shadow:0 7px 0 #653718,0 12px 20px #0008;color:#402215;text-shadow:0 1px #fff5;transform:rotate(-2deg)}
.home-sign span{display:block;font-size:24px;line-height:1}
.home-sign strong{display:block;font-weight:950;font-size:clamp(23px,7vw,32px);line-height:1.05;letter-spacing:-.8px}
.home-sign small{display:block;margin-top:8px;font-weight:800;font-size:12px;background:#fff0c0;border-radius:20px;padding:5px}

},true);

function shortStoryTitle(title){return title.replace(/^(?:Bobby,\s*Hoppel\s*und\s*Krümel|Hoppel\s*und\s*Krümel)\s*[–—-]\s*/i,'')}
function cardsInto(el,list){el.innerHTML=list.map(s=>'<div class="story-wrap '+(completed.includes(s.id)?'is-read':'')+'"><button class="story" onclick="openStory(\''+s.id+'\')"><div class="cover" style="--cover:'+s.color+'">'+(s.artTheme===undefined?'<img src="'+storyImage(s)+'" data-story-id="'+s.id+'" alt="" loading="lazy">':'<span class="generated-cover-symbol" aria-hidden="true">🌙</span>')+'</div>'+(completed.includes(s.id)?'<span class="read-badge" aria-label="Bereits gelesen"><span aria-hidden="true">✓</span> Gelesen</span>':'')+'<b>'+shortStoryTitle(s.title)+'</b>'+(s.artTheme===undefined?'<span class="original-label">✦ Originalgeschichte</span>':'')+'<span class="story-duration">☾ ca. '+readingMinutes(s)+' Min. Lesezeit</span><span class="story-progress">'+(completed.includes(s.id)?'✓ Fertig gelesen':Object.prototype.hasOwnProperty.call(progress,s.id)?'Weiterlesen · '+(Number.isFinite(Number(readPercent[s.id]))?Math.round(Number(readPercent[s.id])):Math.round((progress[s.id]+1)/chunks(s).length*100))+' %':'Noch nicht gelesen')+'</span></button><button type="button" aria-pressed="'+favorites.includes(s.id)+'" class="card-heart '+(favorites.includes(s.id)?'is-favorite':'')+'" aria-label="'+(favorites.includes(s.id)?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen')+'" onclick="toggleFavorite(\''+s.id+'\')">'+'<svg class="favorite-heart-icon" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>'+'</button></div>').join('')||'<div class="empty-state"><span>🌙</span><strong>Noch keine Geschichten hier</strong><p>Entdecke eine Geschichte und speichere sie mit dem Herz als Favorit.</p><button onclick="show(\'library\')">Zur Bibliothek</button></div>'}
function storySortScore(s){return (s.artTheme===undefined?100:0)+(completed.includes(s.id)?-5:0)}
function sortLibraryStories(list){return list.sort((a,b)=>storySortScore(b)-storySortScore(a)||a.title.localeCompare(b.title,'de'))}
function toggleLibrarySearch(force){const panel=$('librarySearchOptions'),btn=document.querySelector('#library .library-search-trigger');const open=typeof force==='boolean'?force:panel.hidden;panel.hidden=!open;btn.setAttribute('aria-expanded',String(open));if(open)$('search').focus()}
function scheduleLibrarySearch(){clearTimeout(searchDelay);searchDelay=setTimeout(()=>{visibleStories=40;renderLibrary()},180)}
function orderLibrary(list){const mode=$('librarySort').value;if(mode==='az')return list.sort((a,b)=>a.title.localeCompare(b.title,'de'));if(mode==='short'||mode==='long')return list.sort((a,b)=>(readingMinutes(a)-readingMinutes(b))*(mode==='short'?1:-1)||a.title.localeCompare(b.title,'de'));return sortLibraryStories(list)}
function loadMoreStories(){const next=libraryMatches.slice(visibleStories,visibleStories+40);visibleStories+=next.length;if(next.length){const holder=document.createElement('div');cardsInto(holder,next);const fragment=document.createDocumentFragment();while(holder.firstChild)fragment.appendChild(holder.firstChild);$('cards').appendChild(fragment)}$('loadMore').hidden=visibleStories>=libraryMatches.length;$('loadMore').textContent='Weitere Geschichten anzeigen ('+Math.max(0,libraryMatches.length-visibleStories)+')'}
function renderLibrary(){let q=$('search').value.trim().toLocaleLowerCase('de');let cats=[...new Set(['Alle','Originale','Abenteuer','Gute Nacht','Lustiges','Advent','Weihnachten','St. Martin',...(window.guten8SeasonNames||[])])];$('chips').innerHTML=cats.map(c=>'<button type="button" aria-pressed="'+(c===category)+'" class="'+(c===category?'selected':'')+'" onclick="category=\''+c+'\';visibleStories=40;renderLibrary()">'+c+'</button>').join('');let matches=stories.filter(s=>(category==='Alle'||(category==='Originale'&&s.artTheme===undefined)||s.category===category)&&(!$('unreadOnly').checked||!completed.includes(s.id))&&searchableStory(s).includes(q));orderLibrary(matches);$('libraryCount').textContent=matches.length+' Geschichten';let done=stories.filter(s=>completed.includes(s.id)).length;const libraryPercent=stories.length?Math.round(done/stories.length*100):0;$('libraryProgressFill').style.width=libraryPercent+'%';$('libraryProgressTrack').setAttribute('aria-valuenow',libraryPercent);$('libraryProgressTrack').setAttribute('aria-valuetext',done+' von '+stories.length+' Geschichten gelesen');$('libraryProgressText').textContent=done+' von '+stories.length+' Geschichten gelesen';libraryMatches=matches;cardsInto($('cards'),matches.slice(0,visibleStories));$('loadMore').hidden=visibleStories>=matches.length;$('loadMore').textContent='Weitere Geschichten anzeigen ('+Math.max(0,matches.length-visibleStories)+')';if(!matches.length){$('cards').innerHTML='<div class="empty-state"><span>🔎</span><strong>Keine passende Geschichte gefunden</strong><p>Versuche einen anderen Suchbegriff oder zeige wieder alle Geschichten an.</p><button onclick="resetLibraryFilters()">Alle Geschichten anzeigen</button></div>'}}
function resetLibraryFilters(){clearTimeout(searchDelay);category='Alle';visibleStories=40;$('search').value='';$('unreadOnly').checked=false;$('librarySort').value='recommended';renderLibrary()}
function renderFavorites(){const list=sortLibraryStories(stories.filter(s=>favorites.includes(s.id)));cardsInto($('favoriteCards'),list);$('favorites').classList.toggle('has-stories',list.length>0);if(!list.length)$('favoriteCards').innerHTML='<div class="empty-state"><span>♡</span><strong>Noch keine Favoriten</strong><p>Tippe bei einer Geschichte auf das Herz, um sie hier wiederzufinden.</p><button onclick="show(\'library\')">Geschichten entdecken</button></div>'}

function openStory(id){$('readerNotice').textContent='';current=stories.find(s=>s.id===id);if(!current)return;const savedPage=Number(progress[id]);page=Number.isInteger(savedPage)&&savedPage>=0?Math.min(savedPage,chunks(current).length-1):0;put('last',id);const savedPercent=Number(readPercent[id]);const restoreFraction=Number.isFinite(savedPercent)&&savedPercent>=0&&savedPercent<=100?savedPercent/100:page/Math.max(1,chunks(current).length-1);restoringReaderScroll=true;renderPage();show('reader');updateReaderFavorite();requestAnimationFrame(()=>{const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);window.scrollTo(0,Math.round(restoreFraction*max));requestAnimationFrame(()=>{restoringReaderScroll=false;refreshReaderScroll()})})}
const storyPageCache=new Map(),storyRemainingWordsCache=new Map();
function remainingWords(s,index){if(!storyRemainingWordsCache.has(s.id)){const pages=chunks(s),counts=pages.map(p=>p.trim().split(/\s+/).filter(Boolean).length),totals=new Array(counts.length);let sum=0;for(let i=counts.length-1;i>=0;i--){sum+=counts[i];totals[i]=sum}storyRemainingWordsCache.set(s.id,totals)}return storyRemainingWordsCache.get(s.id)[index]||0}
function chunks(s){
 if(storyPageCache.has(s.id))return storyPageCache.get(s.id);
 const limit=1150,out=[];let part='';
 const flush=()=>{if(part.trim())out.push(part.trim());part=''};
 const addWord=word=>{if(part&&part.length+word.length+1>limit)flush();part+=(part&&!part.endsWith('\n')?' ':'')+word};
 const addSentence=sentence=>{
  if(part&&part.length+sentence.length+1>limit)flush();
  if(sentence.length<=limit){part+=(part&&!part.endsWith('\n')?' ':'')+sentence;return}
  for(const word of sentence.split(/\s+/).filter(Boolean))addWord(word);
 };
 for(const paragraph of s.text.split(/\n\n+/)){
  const clean=paragraph.trim();if(!clean)continue;
  if(part&&part.length+clean.length+2>limit)flush();
  if(part)part+='\n\n';
  const sentences=clean.match(/[^.!?]+[.!?]+(?:[”"’']+)?|[^.!?]+$/g)||[clean];
  for(const sentence of sentences){const t=sentence.trim();if(t)addSentence(t)}
 }
 flush();
 const pages=out.length?out:[''];storyPageCache.set(s.id,pages);return pages;
}
let touchStart=null;
function readerKeydown(e){if(!current||!$('reader').classList.contains('active')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('button,input,select,textarea'))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();pageMove(1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();pageMove(-1)}}
function readerTouchStart(e){if(e.touches.length!==1){touchStart=null;return}touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}
function readerTouchEnd(e){if(!touchStart)return;const start=touchStart;touchStart=null;if(!current||!e.changedTouches.length||e.touches.length||!$('reader').classList.contains('active'))return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.6)return}
function readerTouchCancel(){touchStart=null}
const storyDurationCache=new Map();
function readingMinutes(s){if(!storyDurationCache.has(s.id))storyDurationCache.set(s.id,Math.max(1,Math.ceil(s.text.trim().split(/\s+/).length/110)));return storyDurationCache.get(s.id)}

function renderPage(){
 if(!current)return;
 const arr=chunks(current);
 page=Math.max(0,Math.min(page,arr.length-1));
 $('readerHeading').textContent=current.title;
 $('readerArt').innerHTML='<img src="'+storyImage(current)+'" data-story-id="'+current.id+'" alt="Illustration zu '+current.title.replace(/"/g,'&quot;')+'" loading="eager">';
 $('readerArt').hidden=false;
 $('readerArt').setAttribute('aria-label','Illustration zu '+current.title);
 $('readingPaper').setAttribute('aria-label','Geschichte: '+current.title+', vollständiger Text');
 $('readerTitle').textContent=current.title;
 $('readerText').textContent=current.text;
 $('pageNum').textContent='Lesefortschritt';
 $('remainingTime').textContent='ca. '+readingMinutes(current)+' Min. Lesezeit';
 $('pageDots').innerHTML='';
 $('prevPage').hidden=true;
 $('nextPage').hidden=true;
 $('finishStory').hidden=completed.includes(current.id);
 updateReaderScrollProgress();
}
let restoringReaderScroll=false;
function updateReaderScrollProgress(){
 if(restoringReaderScroll||!current||!$('reader').classList.contains('active'))return;
 const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
 const fraction=max>0?Math.min(1,Math.max(0,scrollY/max)):1;
 const pct=Math.round(fraction*100);
 const pages=chunks(current);
 page=Math.min(pages.length-1,Math.floor(fraction*pages.length));
 $('pageNum').textContent='Gelesen: '+pct+' %';
 $('readerProgressFill').style.width=pct+'%';
 $('readerProgressTrack').setAttribute('aria-valuenow',pct);
 $('remainingTime').textContent=pct>=99?'Ende der Geschichte':'Noch ca. '+Math.max(1,Math.ceil(readingMinutes(current)*(1-fraction)))+' Min.';
 progress[current.id]=page;
 put('progress',progress);
 if(readPercent[current.id]!==pct){readPercent[current.id]=pct;put('readPercent',readPercent)}
 $('recent').textContent=current.title+' · '+pct+' % gelesen';
 updateRecentProgress(current,page);
}
let readerScrollScheduled=false;
function refreshReaderScroll(){
 if(readerScrollScheduled)return;
 readerScrollScheduled=true;
 requestAnimationFrame(()=>{readerScrollScheduled=false;updateReaderScrollProgress()});
}
function jumpPage(index){if(!current||!Number.isInteger(index)||index<0||index>=chunks(current).length)return;page=index;const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);window.scrollTo({top:Math.round(index/Math.max(1,chunks(current).length-1)*max),behavior:'smooth'})}
function pageMove(n){if(!current)return;const amount=Math.max(180,innerHeight*.72)*Math.sign(n);window.scrollBy({top:amount,behavior:'smooth'})}
function finishReading(){if(!current)return;const firstTime=!completed.includes(current.id);if(firstTime){completed.push(current.id);put('completed',completed)}readPercent[current.id]=100;put('readPercent',readPercent);renderLibrary();renderFavorites();$('finishStory').hidden=true;$('recent').textContent=current.title+' · Fertig gelesen';updateRecentProgress(current,chunks(current).length-1);}
function toggleFavorite(id){if(!stories.some(s=>s.id===id))return;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];put('favorites',favorites);renderLibrary();renderFavorites();if(current&&current.id===id)updateReaderFavorite()}
function updateReaderFavorite(){let btn=$('readerFavorite');if(btn){let saved=favorites.includes(current.id);btn.textContent=saved?'♥':'♡';btn.style.color=saved?'#ff5a71':'';btn.setAttribute('aria-label',saved?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen')}}
function favorite(){if(current)toggleFavorite(current.id)}

function updateRecentProgress(s,p){const bar=$('recentProgressFill');if(!bar)return;bar.style.width=s?(Number.isFinite(Number(readPercent[s.id]))?Math.round(Number(readPercent[s.id])):Math.round((Math.min(Math.max(p,0),chunks(s).length-1)+1)/chunks(s).length*100))+'%':'0%'}
function resume(){let id=get('last',null);if(id&&stories.some(s=>s.id===id))openStory(id);else show('library')}
function setFont(v){font=+v;put('font',font);document.documentElement.style.setProperty('--fontSize',font+'px');$('fontSlider').value=font}
function setBrightness(v){brightness=+v;put('brightness',brightness);document.documentElement.style.setProperty('--readBrightness',brightness/100);$('brightness').value=brightness}
function changeFont(){setFont(font>=26?17:font+2)}
(window.Android?Promise.resolve().then(()=>JSON.parse(Android.stories())):fetch('stories.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})).then(d=>{if(!Array.isArray(d)||!d.length)throw Error('Keine Geschichten');stories=d.concat(window.guten8AuthoredStories||[],window.guten8AdventStories||[],(window.guten8ExtraStories||[]).filter(s=>s.originalTextVerified===true&&s.originalImageVerified===true));renderLibrary();let id=get('last',null);if(id){let s=stories.find(x=>x.id===id);if(s){$('recent').textContent=s.title+(completed.includes(id)?' · Fertig gelesen':' · '+(Number.isFinite(Number(readPercent[id]))?Math.round(Number(readPercent[id])):Math.round(((progress[id]||0)+1)/chunks(s).length*100))+' % gelesen');updateRecentProgress(s,completed.includes(id)?chunks(s).length-1:(progress[id]||0))}}document.addEventListener('keydown',readerKeydown);window.addEventListener('scroll',refreshReaderScroll,{passive:true});$('readingPaper').addEventListener('touchstart',readerTouchStart,{passive:true});$('readingPaper').addEventListener('touchend',readerTouchEnd,{passive:true});$('readingPaper').addEventListener('touchcancel',readerTouchCancel,{passive:true});setFont(font);setBrightness(brightness);if(window.Android){$('version').textContent=Android.version()}}).catch(e=>{$('cards').textContent='Geschichten konnten nicht geladen werden.'});

function openStoryImage(){
 if(!current)return;
 const img=$('readerArt').querySelector('img');
 if(!img)return;
 const overlay=$('storyImageOverlay');
 overlay.querySelector('img').src=img.currentSrc||img.src;
 overlay.querySelector('img').alt='Großansicht: '+current.title;
 overlay.hidden=false;
 overlay.setAttribute('aria-hidden','false');
 document.body.classList.add('story-image-open');
 $('storyImageClose').focus({preventScroll:true});
}
function closeStoryImage(){
 const overlay=$('storyImageOverlay');
 if(overlay.hidden)return;
 overlay.hidden=true;overlay.setAttribute('aria-hidden','true');
 document.body.classList.remove('story-image-open');
 $('readerArt').focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('storyImageOverlay').hidden){e.preventDefault();closeStoryImage()}
});
</script><div id="storyImageOverlay" class="story-image-overlay" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Geschichtenbild vergrößert ansehen" onclick="if(event.target===this)closeStoryImage()"><button type="button" id="storyImageClose" class="story-image-close" onclick="closeStoryImage()" aria-label="Großansicht schließen">×</button><img alt="Vergrößerte Geschichtenillustration" /></div></body></html>
