name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate story library
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('app/src/main/assets/stories.json')
          stories = json.loads(path.read_text(encoding='utf-8'))
          assert stories and isinstance(stories, list)
          ids = set()
          for story in stories:
              assert all(story.get(k) for k in ('id','title','text','category','emoji','color'))
              assert story['id'] not in ids, f"Duplicate story: {story['id']}"
              ids.add(story['id'])
          html = pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'onUpdateResult' in html and 'stories.json' in html
          print(f'Validated {len(stories)} stories and application entry point')
          PY
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Verify signing configuration
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -s "$RUNNER_TEMP/release.jks"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then gradle :app:assembleRelease --no-daemon; else gradle :app:assembleDebug --no-daemon; fi
      - name: Publish signed latest release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk guten8-latest.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Increase versionCode and versionName before publishing another update."
            exit 1
          fi
          gh release create "v$VERSION" guten8-latest.apk --title "GuteN8 v$VERSION" --notes "Version $VERSION" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: GuteN8-APK
          path: app/build/outputs/apk/**/*.apk
