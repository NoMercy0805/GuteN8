name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate story library
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('app/src/main/assets/stories.json')
          stories = json.loads(path.read_text(encoding='utf-8'))
          assert stories and isinstance(stories, list)
          ids = set()
          for story in stories:
              assert all(story.get(k) for k in ('id','title','text','category','emoji','color'))
              assert story['id'] not in ids, f"Duplicate story: {story['id']}"
              ids.add(story['id'])
              art=pathlib.Path('app/src/main/assets/art',story['id']+'.svg')
              assert art.is_file(), f"Missing story illustration: {story['id']}"
              assert ET.parse(art).getroot().tag.endswith('svg'), f"Invalid SVG: {art}"
          html = pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'onUpdateResult' in html and 'Android.stories()' in html
          assert 'function readingMinutes(s)' in html and 'function chunks(s)' in html
          assert "'<img src=\"'+storyImage(s)" in html, 'Story cards must use illustrated covers'
          assert "$('readerArt').innerHTML" in html, 'Reader illustration missing'
          assert "function jumpPage(index)" in html and "stopSpeech();page=index" in html, 'Page jumps must cancel stale narration'
          assert 'id="readingPaper"' in html and 'function readerTouchEnd(e)' in html, 'Swipe reader wiring missing'
          assert 'readingPaper\').addEventListener(\'touchend\'' in html, 'Swipe handler must be registered'
          assert 'class="empty-state"' in html, 'Empty library states missing'
          assert 'id="readerProgressTrack"' in html and 'id="readerProgressFill"' in html, 'Reader progress UI missing'
          assert 'function readerKeydown(e)' in html, 'Keyboard navigation missing'
          assert 'function resetLibraryFilters()' in html, 'Library search reset missing'
          assert 'if(!matches.length){' in html, 'Library empty-results branch must have valid syntax'
          assert "'')+'<span class=\"story-duration\">" in html, 'Story card badge must be concatenated safely'
          assert 'function sortLibraryStories(list)' in html, 'Library sorting missing'
          assert 'id="unreadOnly"' in html and 'id="librarySort"' in html, 'Library filter controls missing'
          assert 'function orderLibrary(list)' in html and "$('unreadOnly').checked" in html, 'Library filter logic missing'
          assert 'const storyArtCache=new Map()' in html, 'Artwork caching missing'
          assert 'function scheduleLibrarySearch()' in html, 'Debounced library search missing'
          assert 'const dotIndices=' in html and 'page-ellipsis' in html, 'Long-story page navigation missing'
          assert "while(holder.firstChild)$('cards').appendChild(holder.firstChild)" in html, 'Incremental story pagination missing'
          assert 'const seasonal=' in html and 'const themed=pool.filter' in html, 'Seasonal recommendations missing'
          assert "'Originale'" in html and 'original-label' in html, 'Written stories need a dedicated filter and label'
          assert 'extra-stories.js' in html and 'function loadMoreStories()' in html, 'Extra story loading or pagination missing'
          for classic in ('fliegender-kuchen','verschwundene-kuerbisse','mia-bobby-boot'):
              assert classic in ids, f'Missing classic story: {classic}'
          extra=pathlib.Path('app/src/main/assets/extra-stories.js').read_text(encoding='utf-8')
          assert 'window.guten8ExtraStories=stories' in extra and 'window.guten8ExtraArt=function(s)' in extra, 'Seasonal story generator missing'
          assert 'p<places.length' in extra and 'q<quests.length' in extra and 't<turns.length' in extra, 'Story generator loops missing'
          assert 'const resolutions=' in extra and 'resolutions[q]' in extra, 'Distinct quest endings missing'
          assert 'const seasonalDecor=' in extra and 'decor=seasonalDecor[s.artTheme]' in extra, 'Seasonal cover decorations missing'
          for classic in ('fliegender-kuchen','verschwundene-kuerbisse','mia-bobby-boot'):
              original=next(s for s in stories if s['id']==classic)
              assert 'artTheme' not in original, f'Original incorrectly treated as generated: {classic}'
          assert extra.count('Eine junge Eule') == 1, 'Story endings may have been duplicated'
          assert 'id="speechRate"' in html and 'function setSpeechRate(v)' in html, 'Speech speed controls missing'
          assert 'id="readerSpeak"' in html and 'id="settingsSpeak"' in html, 'Speech buttons missing'
          assert 'function stopSpeech()' in html and 'function updateSpeechButtons(active)' in html, 'Narration controls missing'
          assert 'stopSpeech();document.querySelectorAll' in html, 'Navigation speech-stop separator missing'
          assert 'if(firstTime)storyFinished()' not in html, 'Bedtime reminders must work on rereads'
          assert 'id="recentProgressFill"' in html and 'function updateRecentProgress(s,p)' in html, 'Home reading progress missing'
          assert "if(!$('reader').classList.contains('active'))show('reader')" in html, 'Narration must open reader'
          assert 'on:\n  workflow_dispatch:' in pathlib.Path('.github/workflows/android.yml').read_text(), 'Automatic builds must remain disabled'
          forest=pathlib.Path('app/src/main/assets/art/forest-friends.svg')
          assert forest.is_file(), 'Missing illustrated forest artwork'
          assert ET.parse(forest).getroot().tag.endswith('svg'), 'Invalid forest SVG'
          print(f'Validated {len(stories)} stories and application entry point')
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          Path('/tmp/guten8-app.js').write_text(html.split('<script>')[-1].split('</script>')[0], encoding='utf-8')
          PY
          node --check /tmp/guten8-app.js
          node --check app/src/main/assets/extra-stories.js
      - name: Check reader, bookmarks and navigation wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          java=Path('app/src/main/java/de/nomercy/guten8/MainActivity.java').read_text(encoding='utf-8')
          checks = {
              'reader heading': ('id="readerHeading"', "$('readerHeading').textContent=current.title"),
              'reader progress': ('id="pageNum"', 'function renderPage()'),
              'bookmarks': ('id="bookmarkCards"', 'function renderBookmarks()'),
              'favorites': ('id="favoriteCards"', 'function toggleFavorite(id)'),
              'update prompt': ('id="updateInstall"', 'function installUpdate()'),
              'android back': ('window.guten8Back=', 'window.guten8Back ? window.guten8Back()'),
          }
          for name,(a,b) in checks.items():
              assert a in html and (b in html or b in java), f'Missing {name}'
          import re
          ids=set(re.findall(r'\bid="([^"]+)"',html))
          references=set(re.findall(r"\$\('([^']+)'\)",html.split('<script>')[-1]))
          missing=sorted(references-ids)
          assert not missing, f'JavaScript refers to missing HTML IDs: {missing}'
          print(f'All reader/navigation smoke checks passed; {len(references)} DOM IDs verified')
          PY
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Verify signing configuration
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -s "$RUNNER_TEMP/release.jks"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then gradle :app:assembleRelease --no-daemon; else gradle :app:assembleDebug --no-daemon; fi
      - name: Publish signed latest release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk guten8-latest.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Increase versionCode and versionName before publishing another update."
            exit 1
          fi
          gh release create "v$VERSION" guten8-latest.apk --title "GuteN8 v$VERSION" --notes "$(printf 'Version %s\nAndroid-versionCode: %s\n\nGuteN8 – Gutenachtgeschichten mit Bobby, Hoppel und Krümel.' "$VERSION" "$GITHUB_RUN_NUMBER")" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: GuteN8-APK
          path: app/build/outputs/apk/**/*.apk
