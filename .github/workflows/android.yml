name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and publish GuteN8 launcher icons
        run: |
          if [ -f GuteN8-icons-res.zip ]; then
            mkdir -p /tmp/guten8-icon-assets
            unzip -oq GuteN8-icons-res.zip -d /tmp/guten8-icon-assets
            test -s /tmp/guten8-icon-assets/res/mipmap-xhdpi/ic_launcher.png
            cp -R /tmp/guten8-icon-assets/res/. app/src/main/res/
            git add app/src/main/res/
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add Bobby Hoppel and Kruemel launcher image resources"
              git push origin HEAD:main
            fi
          fi
      - name: Import original story illustrations when archive is present
        run: |
          if [ -f GuteN8_7_Originalbilder_importbereit.zip ]; then
            python3 scripts/import_originalbilder.py GuteN8_7_Originalbilder_importbereit.zip
            git add app/src/main/assets/stories.json app/src/main/assets/art/
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Import original GuteN8 story illustrations"
              git push origin HEAD:main
            fi
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "::error::Android SDK manager not found under $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Report original story completion
        run: python3 scripts/original_story_progress.py
      - name: Check all scenes in three recovered originals
        run: python3 tests/original-three-stories.py
      - name: Test reader pagination
        run: node tests/reader-pagination.test.js
      - name: Test storybook theme assets
        run: node tests/theme-assets.test.js
      - name: Validate story library
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('app/src/main/assets/stories.json')
          stories = json.loads(path.read_text(encoding='utf-8'))
          assert stories and isinstance(stories, list)
          ids = set()
          for story in stories:
              assert all(story.get(k) for k in ('id','title','text','category','emoji','color'))
              assert story['id'] not in ids, f"Duplicate story: {story['id']}"
              ids.add(story['id'])
              art=pathlib.Path('app/src/main/assets/art',story['id']+'.svg')
              assert art.is_file(), f"Missing story illustration: {story['id']}"
              assert ET.parse(art).getroot().tag.endswith('svg'), f"Invalid SVG: {art}"
          html = pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'onUpdateResult' in html and 'Android.stories()' in html
          assert 'function readingMinutes(s)' in html and 'function chunks(s)' in html
          assert "'<img src=\"'+storyImage(s)" in html, 'Story cards must use illustrated covers'
          assert "$('readerArt').innerHTML" in html, 'Reader illustration missing'
          assert 'id="readingPaper"' in html and 'function readerTouchEnd(e)' in html, 'Swipe reader wiring missing'
          assert 'readingPaper\').addEventListener(\'touchend\'' in html, 'Swipe handler must be registered'
          assert "addEventListener('touchcancel',readerTouchCancel" in html and 'function readerTouchCancel()' in html, 'Cancelled swipes must reset touch state'
          assert 'if(e.touches.length!==1){touchStart=null;return}' in html, 'Multitouch must not trigger page turns'
          assert 'id="readerNotice"' in html and "$('readerNotice').textContent=saved?" in html, 'Bookmark confirmation must be nonblocking'
          assert 'class="empty-state"' in html, 'Empty library states missing'
          assert 'Noch keine Favoriten' in html and 'Noch keine Lesezeichen' in html, 'Empty saved-story states missing'
          assert 'id="readerProgressTrack"' in html and 'id="readerProgressFill"' in html, 'Reader progress UI missing'
          assert 'id="libraryProgressTrack"' in html and "$('libraryProgressTrack').setAttribute('aria-valuenow',libraryPercent)" in html, 'Accessible library progress missing'
          assert 'function readerKeydown(e)' in html, 'Keyboard navigation missing'
          assert "$('readerText').textContent=arr[page]" in html, 'Reader must display only selected page'
          assert 'function pageMove(n)' in html, 'Reader navigation must exist'
          assert "updateOffer=null;$('updateInstall').hidden=true" in html, 'Update checks must clear stale download offers'
          assert 'window.onUpdateError=e=>' in html and "$('updateInstall').hidden=true" in html, 'Update error must hide download button'
          assert 'function resetLibraryFilters()' in html, 'Library search reset missing'
          assert 'if(!matches.length){' in html, 'Library empty-results branch must have valid syntax'
          assert "'')+'<span class=\"story-duration\">" in html, 'Story card badge must be concatenated safely'
          assert 'function sortLibraryStories(list)' in html, 'Library sorting missing'
          assert 'id="unreadOnly"' in html and 'id="librarySort"' in html, 'Library filter controls missing'
          assert 'function orderLibrary(list)' in html and "$('unreadOnly').checked" in html, 'Library filter logic missing'
          assert 'const storyArtCache=new Map()' in html, 'Artwork caching missing'
          assert 'const storySearchCache=new Map()' in html and 'searchableStory(s).includes(q)' in html, 'Search index caching missing'
          assert 'favorites=Array.isArray(favorites)?' in html and 'bookmarks=Array.isArray(bookmarks)?' in html, 'Saved story lists must be validated'
          assert "progress=progress&&typeof progress==='object'&&!Array.isArray(progress)?progress:{}" in html, 'Saved reading progress must be validated'
          assert 'Number.isInteger(index)||index<0||index>=chunks(current).length' in html, 'Reader must reject invalid page requests'
          assert 'function scheduleLibrarySearch()' in html, 'Debounced library search missing'
          assert 'const dotIndices=' in html and '.page-dots .page-ellipsis{display:inline-flex' in html, 'Long-story page navigation must show ellipsis'
          assert 'document.createDocumentFragment()' in html and "$('cards').appendChild(fragment)" in html, 'Incremental story pagination missing'
          assert 'const storyPageCache=new Map(),storyRemainingWordsCache=new Map()' in html and 'const storyDurationCache=new Map()' in html, 'Story text caching missing'
          assert 'remainingWords(current,page)' in html, 'Remaining reading time must use cached word counts'
          assert 'aria-pressed=' in html and 'favorites.includes(s.id)' in html, 'Accessible selection states missing'
          assert 'const seasonal=' in html and 'const themed=pool.filter' in html, 'Seasonal recommendations missing'
          assert "'Originale'" in html and 'original-label' in html, 'Written stories need a dedicated filter and label'
          assert 'extra-stories.js' in html and 'function loadMoreStories()' in html, 'Extra story loading or pagination missing'
          for classic in ('fliegender-kuchen','verschwundene-kuerbisse','schatztruhe'):
              assert classic in ids, f'Missing classic story: {classic}'
          extra=pathlib.Path('app/src/main/assets/extra-stories.js').read_text(encoding='utf-8')
          assert 'window.guten8ExtraStories=stories' in extra and 'window.guten8ExtraArt=function(s)' in extra, 'Seasonal story generator missing'
          assert 'p<places.length' in extra and 'q<quests.length' in extra and 't<turns.length' in extra, 'Story generator loops missing'
          assert 'const resolutions=' in extra and 'resolutions[q]' in extra, 'Distinct quest endings missing'
          assert 'const seasonalDecor=' in extra and 'decor=seasonalDecor[s.artTheme]' in extra and "'+decor+variant+'<g font-family" in extra, 'Seasonal cover decorations must be rendered in SVG'
          assert 'const seasonalScenes=' in extra and 'seasonalScenes[p]' in extra, 'Seasonal story scenes missing'
          assert 'const characterMoments=' in extra and 'characterMoments[(q+t)%characterMoments.length]' in extra, 'Varied character moments missing'
          assert 'const chapterNames=' in extra and 'chapterNames[t]' in extra, 'Generated story titles must be distinct'
          assert 'Gute Nacht!' in extra and 'artVariant:t' in extra, 'Varied bedtime endings missing'
          for classic in ('fliegender-kuchen','verschwundene-kuerbisse','schatztruhe'):
              original=next(s for s in stories if s['id']==classic)
              assert 'artTheme' not in original, f'Original incorrectly treated as generated: {classic}'
          assert extra.count('Eine junge Eule') == 1, 'Story endings may have been duplicated'
          assert 'if(firstTime)storyFinished()' not in html, 'Bedtime reminders must work on rereads'
          assert 'id="recentProgressFill"' in html and 'function updateRecentProgress(s,p)' in html, 'Home reading progress missing'
          assert '  push:\n    branches: [main]' in pathlib.Path('.github/workflows/android.yml').read_text(), 'Automatic builds on main must remain enabled'
          forest=pathlib.Path('app/src/main/assets/art/forest-friends.svg')
          assert forest.is_file(), 'Missing illustrated forest artwork'
          assert ET.parse(forest).getroot().tag.endswith('svg'), 'Invalid forest SVG'
          print(f'Validated {len(stories)} stories and application entry point')
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          Path('/tmp/guten8-app.js').write_text(html.split('<script>')[-1].split('</script>')[0], encoding='utf-8')
          PY
          node --check /tmp/guten8-app.js
          node --check app/src/main/assets/extra-stories.js
      - name: Test generated story catalog and artwork
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('app/src/main/assets/extra-stories.js','utf8'),context);
          const stories=context.window.guten8ExtraStories;
          assert.equal(stories.length,1000,'Expected 1000 generated stories');
          assert.equal(new Set(stories.map(s=>s.id)).size,1000,'Duplicate story IDs');
          assert.equal(new Set(stories.map(s=>s.title)).size,1000,'Duplicate story titles');
          assert.equal(new Set(stories.map(s=>s.category)).size,10,'Missing seasons');
          assert(new Set(stories.map(s=>s.text.match(/Dort schauten sie sich aufmerksam um\. ([^\\n]+)/)?.[1])).size>=10,'Generated stories need varied quest clues');
          assert(stories.every(s=>s.text.length>300),'Generated story too short');
          const expectedMotifs=['🔔','🗝️','⭐','⛵','🪁','🗺️','🐿️','☂️','✨','🍰','🧢','🎐','🪶','☁️','🎒','🏮','🎵','🧭','🫧','🛏️'];
          const expectedSeasons=['Frühling','Sommer','Herbst','Winter','Halloween','Weihnachten','Advent','Ostern','Silvester','Geburtstag'];
          let checked=0;
          const uniqueCovers=new Set();
          for(const story of stories){
            assert(Number.isInteger(story.artTheme)&&story.artTheme>=0&&story.artTheme<10,'Invalid theme: '+story.id);
            assert(Number.isInteger(story.artMotif)&&story.artMotif>=0&&story.artMotif<20,'Invalid motif: '+story.id);
            assert.equal(story.category,expectedSeasons[story.artTheme],'Season/category mismatch: '+story.id);
            assert(story.text.includes('Bobby')&&story.text.includes('Hoppel')&&story.text.includes('Krümel'),'Missing story characters: '+story.id);
            assert(story.text.endsWith('Gute Nacht!'),'Missing bedtime ending: '+story.id);
            const cover=context.window.guten8ExtraArt(story);
            assert(cover.startsWith('data:image/svg+xml;charset=utf-8,'),'Invalid SVG image URL: '+story.id);
            uniqueCovers.add(cover);
            assert(Number.isInteger(story.artVariant)&&story.artVariant>=0&&story.artVariant<5,'Invalid image variant: '+story.id);
            const svg=decodeURIComponent(cover.split(',')[1]);
            assert(svg.includes('<svg ')&&svg.includes('</svg>'),'Malformed SVG image: '+story.id);
            assert(svg.includes(expectedMotifs[story.artMotif]),'Cover does not depict story motif: '+story.id);
            assert(svg.includes(['🌷','☀️','🍁','❄️','🎃','🎄','🕯️','🐣','🎆','🎂'][story.artTheme]),'Cover does not depict season: '+story.id);
            assert(svg.includes('🐻')&&svg.includes('🐰')&&svg.includes('🐹'),'Cover missing protagonists: '+story.id);
            checked++;
          }
          assert.equal(uniqueCovers.size,1000,'Every story must have a distinct SVG variant');
          console.log('Validated '+checked+' generated stories and their SVGs for season, motif and protagonists');
          JS
      - name: Check reader, bookmarks and navigation wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          java=Path('app/src/main/java/de/nomercy/guten8/MainActivity.java').read_text(encoding='utf-8')
          checks = {
              'reader heading': ('id="readerHeading"', "$('readerHeading').textContent=current.title"),
              'reader progress': ('id="pageNum"', 'function renderPage()'),
              'bookmarks': ('id="bookmarkCards"', 'function renderBookmarks()'),
              'favorites': ('id="favoriteCards"', 'function toggleFavorite(id)'),
              'update prompt': ('id="updateInstall"', 'function installUpdate()'),
              'android back': ('window.guten8Back=', 'window.guten8Back ? window.guten8Back()'),
          }
          for name,(a,b) in checks.items():
              assert a in html and (b in html or b in java), f'Missing {name}'
          import re
          ids=set(re.findall(r'\bid="([^"]+)"',html))
          references=set(re.findall(r"\$\('([^']+)'\)",html.split('<script>')[-1]))
          missing=sorted(references-ids)
          assert not missing, f'JavaScript refers to missing HTML IDs: {missing}'
          print(f'All reader/navigation smoke checks passed; {len(references)} DOM IDs verified')
          PY
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Persistent signing secrets missing. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Refusing to publish a temporary debug-signed APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA1:'

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature matches configured keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          EXPECTED=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test -n "$EXPECTED" && test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK signature does not match configured signing key"; exit 1; }
          echo "Verified stable signing certificate: $ACTUAL"

      - name: Publish verified signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" guten8-latest.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 1
          fi
          gh release create "v$VERSION" guten8-latest.apk --title "GuteN8 v$VERSION" --notes "$(printf 'Version %s\nAndroid-versionCode: %s\nChannel: verified stable signed release\n\nGuteN8 – Gutenachtgeschichten mit Bobby, Hoppel und Krümel.' "$VERSION" "$GITHUB_RUN_NUMBER")" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: GuteN8-APK
          path: app/build/outputs/apk/**/*.apk
